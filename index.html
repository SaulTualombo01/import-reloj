<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IMPORT RELOJ | Catálogo Exclusivo</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado con Bootstrap -->
  <header class="header bg-white border-bottom shadow-sm sticky-top">
    <div class="container py-2 d-flex flex-column align-items-center gap-2">
      <div class="brand-logo">
        <img src="imagenes/logo.jpg" alt="Logo IMPORT RELOJ" class="logo-img">
      </div>
      
      <!-- Menú de marcas: Se distribuye en filas ordenadas en celulares sin salirse de la pantalla -->
      <nav class="brand-nav d-flex flex-wrap justify-content-center gap-1 w-100" id="brandNav">
        <button class="nav-btn active" data-brand="all">Todos</button>
        <button class="nav-btn" data-brand="fossil">Fossil</button>
        <button class="nav-btn" data-brand="casio">Casio</button>
        <button class="nav-btn" data-brand="anne-klein">Anne Klein</button>
        <button class="nav-btn" data-brand="smartwatch">Smartwatch</button>
      </nav>
    </div>
  </header>

  <!-- Banner -->
  <section class="hero-banner text-center bg-white border-bottom py-3 px-3">
    <div class="container">
      <h2 class="mb-1">Catálogo Exclusivo</h2>
      <p class="text-muted small mb-0">Modelos de alta precisión, resistencia y diseño garantizado.</p>
    </div>
  </section>

  <!-- Buscador y Subfiltros -->
  <section class="filter-section container py-3">
    <div class="row justify-content-center g-2">
      <!-- Buscador 100% encajado -->
      <div class="col-12 col-md-8 col-lg-6">
        <div class="search-input-group">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="form-control" placeholder="Buscar reloj por modelo o marca..." aria-label="Buscar reloj">
        </div>
      </div>

      <!-- Filtros por género -->
      <div class="col-12 d-flex flex-wrap align-items-center justify-content-between pt-2">
        <div class="gender-filters d-flex gap-1">
          <button class="filter-pill active" data-gender="all">Todos</button>
          <button class="filter-pill" data-gender="hombre">Hombre</button>
          <button class="filter-pill" data-gender="mujer">Mujer</button>
        </div>
        <div class="counter-display text-muted fw-bold small" id="productCount">14 modelos</div>
      </div>
    </div>
  </section>

  <!-- Grilla del Catálogo -->
  <main class="container pb-5">
    <div class="row g-3" id="catalogGrid"></div>
  </main>

  <!-- Modal Adaptativo Bootstrap -->
  <div class="modal-overlay" id="watchModal" aria-hidden="true">
    <div class="modal-card">
      <button class="close-modal-btn" id="closeModal" aria-label="Cerrar modal">✕</button>
      <div class="modal-scroll-content" id="modalBody"></div>
    </div>
  </div>

  <!-- Botón Flotante Permanente de WhatsApp -->
  <a href="https://wa.me/593967296100?text=Hola%20IMPORT%20RELOJ,%20deseo%20más%20información%20sobre%20su%20catálogo%20de%20relojes." 
     target="_blank" 
     rel="noopener noreferrer" 
     class="whatsapp-floating-btn" 
     title="Contáctanos por WhatsApp">
    <span>💬 WhatsApp</span>
  </a>

  <!-- Footer -->
  <footer class="footer text-center py-3 bg-white border-top">
    <div class="container">
      <p class="text-muted small mb-0">&copy; 2026 IMPORT RELOJ. Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
